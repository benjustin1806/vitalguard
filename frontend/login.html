<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VitalGuard — Clinical Portal Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0d14;
      --card-bg: rgba(18, 24, 38, 0.75);
      --border-color: rgba(255, 255, 255, 0.1);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #1e293b, #0f172a, #090d16);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 242, 254, 0.1);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-icon {
      font-size: 42px;
      margin-bottom: 8px;
      display: inline-block;
      filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.5));
    }

    .brand-title {
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
      background: rgba(255, 255, 255, 0.08);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 114, 255, 0.3);
      margin-top: 10px;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 114, 255, 0.45);
    }

    .error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--accent-red);
      color: #fca5a5;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      margin-bottom: 20px;
      text-align: center;
    }

    .demo-section {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid var(--border-color);
      text-align: center;
    }

    .demo-title {
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .demo-chips {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .chip {
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip:hover {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand-header">
      <div class="brand-icon">🛡️</div>
      <div class="brand-title">VitalGuard</div>
      <div class="brand-subtitle">Clinical Staff & Telemetry Access Portal</div>
    </div>

    <div id="errorBanner" class="error-banner">Invalid username or password</div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" class="form-input" placeholder="e.g. priya.nair or anita" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="login-btn" id="submitBtn">Sign In to Dashboard</button>
    </form>

    <div class="demo-section">
      <div class="demo-title">Quick Demo Login</div>
      <div class="demo-chips">
        <button class="chip" onclick="fillDemo('priya.nair', 'doctor123')">👨‍⚕️ Dr. Priya (Doctor)</button>
        <button class="chip" onclick="fillDemo('anita', 'nurse123')">👩‍⚕️ Nurse Anita (Nurse)</button>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:8000';

    function fillDemo(user, pass) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = pass;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorBanner = document.getElementById('errorBanner');
      const submitBtn = document.getElementById('submitBtn');

      errorBanner.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Authenticating...';

      try {
        const res = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || 'Authentication failed');
        }

        const data = await res.json();
        localStorage.setItem('vitalguard_token', data.token);
        localStorage.setItem('vitalguard_staff', JSON.stringify(data.staff));

        window.location.href = 'patients.html';
      } catch (err) {
        errorBanner.innerText = err.message;
        errorBanner.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
